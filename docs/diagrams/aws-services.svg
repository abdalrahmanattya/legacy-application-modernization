<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc"><title id="title">Order Reference Service planned AWS architecture</title><desc id="desc">Customers reach optional CloudFront and an application load balancer before private ECS API containers. Cognito verifies identity. Aurora stores orders. A separate ECS publisher sends report jobs to SQS, an ECS worker writes finished reports to S3, and CloudWatch, Secrets Manager, KMS, and ECR support the environment.</desc>
