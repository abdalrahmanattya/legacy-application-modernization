<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1400 650">
  <title id="title">Legacy application modernization target architecture</title>
  <desc id="desc">The locally verified boundary contains a Node.js API, SQLite fixture, transactional outbox, publisher, report worker, and local artifact store. A separate AWS target design, explicitly not deployed, contains a regional WAF and private HTTPS load balancer, private ECS Fargate tasks, Aurora PostgreSQL, SQS with a dead-letter queue, an ECS report worker, private S3 artifacts, and CloudWatch telemetry. GitHub OIDC and Terraform are shown as a plan-only delivery identity and reviewable target.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><style>text{font-family:Arial,sans-serif;fill:#0f172a}.box{fill:#fff;stroke:#475569;stroke-width:2}.local{fill:#ecfdf5;stroke:#15803d;stroke-width:3}.target{fill:#eff6ff;stroke:#2563eb;stroke-width:3}.warning{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:8 6}.muted{fill:#475569;font-size:16px}</style></defs>
  <rect width="1400" height="650" fill="#fff"/>
  <text x="700" y="42" text-anchor="middle" font-size="29" font-weight="700">Legacy application modernization architecture</text>
  <rect class="local" x="45" y="80" width="610" height="465" rx="16"/>
  <text x="350" y="116" text-anchor="middle" font-size="22" font-weight="700">Locally verified boundary</text>
  <text x="350" y="143" text-anchor="middle" class="muted">SQLite fixtures · deterministic tests · no AWS credentials</text>
  <rect class="box" x="75" y="210" width="125" height="72" rx="10"/><text x="137" y="240" text-anchor="middle" font-size="17" font-weight="700">Client</text><text x="137" y="264" text-anchor="middle" class="muted">HTTP</text>
  <rect class="box" x="235" y="190" width="180" height="112" rx="10"/><text x="325" y="224" text-anchor="middle" font-size="18" font-weight="700">Node.js API</text><text x="325" y="250" text-anchor="middle" class="muted">/healthz · /readyz</text><text x="325" y="274" text-anchor="middle" class="muted">/v1 · /v2</text>
  <rect class="box" x="470" y="170" width="145" height="75" rx="10"/><text x="542" y="200" text-anchor="middle" font-size="17" font-weight="700">SQLite</text><text x="542" y="224" text-anchor="middle" class="muted">fixture data</text>
  <path class="arrow" d="M200 246 H230"/><path class="arrow" d="M415 230 H465"/>
  <rect class="box" x="225" y="365" width="155" height="75" rx="10"/><text x="302" y="395" text-anchor="middle" font-size="17" font-weight="700">Outbox</text><text x="302" y="419" text-anchor="middle" class="muted">transactional</text>
  <rect class="box" x="425" y="365" width="155" height="75" rx="10"/><text x="502" y="395" text-anchor="middle" font-size="17" font-weight="700">Publisher</text><text x="502" y="419" text-anchor="middle" class="muted">process</text>
  <path class="arrow" d="M325 302 V360"/><path class="arrow" d="M380 402 H420"/>
  <rect class="box" x="300" y="470" width="155" height="55" rx="10"/><text x="377" y="504" text-anchor="middle" font-size="17" font-weight="700">Worker → artifacts</text><path class="arrow" d="M502 440 V465 H455"/>
  <rect class="target" x="700" y="80" width="655" height="465" rx="16"/>
  <text x="1027" y="116" text-anchor="middle" font-size="22" font-weight="700">AWS target design — NOT DEPLOYED</text>
  <text x="1027" y="143" text-anchor="middle" class="muted">Terraform plan-only · explicit inputs · cloud evidence pending</text>
  <rect class="box" x="730" y="205" width="145" height="82" rx="10"/><text x="802" y="237" text-anchor="middle" font-size="16" font-weight="700">Regional WAF</text><text x="802" y="261" text-anchor="middle" class="muted">private HTTPS ALB</text>
  <rect class="box" x="915" y="190" width="175" height="112" rx="10"/><text x="1002" y="224" text-anchor="middle" font-size="17" font-weight="700">Private ECS/Fargate</text><text x="1002" y="250" text-anchor="middle" class="muted">API task</text><text x="1002" y="274" text-anchor="middle" class="muted">immutable image</text>
  <rect class="box" x="1140" y="170" width="170" height="75" rx="10"/><text x="1225" y="200" text-anchor="middle" font-size="17" font-weight="700">Aurora PostgreSQL</text><text x="1225" y="224" text-anchor="middle" class="muted">encrypted private data</text>
  <rect class="box" x="1140" y="280" width="170" height="75" rx="10"/><text x="1225" y="310" text-anchor="middle" font-size="17" font-weight="700">SQS + DLQ</text><text x="1225" y="334" text-anchor="middle" class="muted">async reports</text>
  <rect class="box" x="915" y="365" width="175" height="75" rx="10"/><text x="1002" y="395" text-anchor="middle" font-size="17" font-weight="700">ECS report worker</text><text x="1002" y="419" text-anchor="middle" class="muted">lease + retry</text>
  <rect class="box" x="1140" y="390" width="170" height="75" rx="10"/><text x="1225" y="420" text-anchor="middle" font-size="17" font-weight="700">Private S3</text><text x="1225" y="444" text-anchor="middle" class="muted">checksummed artifacts</text>
  <rect class="box" x="730" y="390" width="145" height="75" rx="10"/><text x="802" y="420" text-anchor="middle" font-size="17" font-weight="700">CloudWatch</text><text x="802" y="444" text-anchor="middle" class="muted">logs + alarms</text>
  <path class="arrow" d="M875 246 H910"/><path class="arrow" d="M1090 230 H1135"/><path class="arrow" d="M1090 260 H1120 V317 H1135"/><path class="arrow" d="M1225 355 V385"/><path class="arrow" d="M1140 427 H1095"/><path class="arrow" d="M915 410 H880"/>
  <rect class="warning" x="715" y="500" width="575" height="32" rx="8"/><text x="1002" y="522" text-anchor="middle" font-size="15" font-weight="700">GitHub OIDC + Terraform are delivery design only; apply is disabled</text>
  <path class="arrow dashed" d="M655 310 H690"/><text x="672" y="295" text-anchor="middle" class="muted">same contracts</text>
</svg>
