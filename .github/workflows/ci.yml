name: baseline-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:wave3
      - run: npm run lint
      - run: npm run format
      - run: npm audit --audit-level=high
      - run: docker buildx build --platform linux/amd64 --load --pull=false -t order-reference-service:ci .
      - run: mkdir -p wave1-evidence
      - run: docker image inspect order-reference-service:ci --format '{{.Id}} {{.Os}}/{{.Architecture}} {{.Config.User}} {{json .Config.Healthcheck}}' | tee wave1-evidence/image.txt
      - run: chmod +x scripts/container-acceptance.sh && WAVE1_PORT=18080 scripts/container-acceptance.sh order-reference-service:ci | tee wave1-evidence/runtime.txt
      - run: |
          IMAGE_REF=order-reference-service:ci docker compose up -d --wait
          trap 'docker compose down -v' EXIT
          curl --fail --silent http://127.0.0.1:3000/readyz
          test "$(docker compose exec -T order-reference node -p 'process.getuid()')" = 1000
          ! docker run --rm -e ENVIRONMENT=container order-reference-service:ci >/tmp/container-config.log 2>&1
          grep -q 'server.start_failed' /tmp/container-config.log
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: order-reference-service:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: order-reference-service:ci
          format: json
          output: wave1-evidence/trivy-summary.json
          severity: CRITICAL,HIGH
          exit-code: 0
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: order-reference-service:ci
          format: cyclonedx
          output: sbom.json
          exit-code: 0
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: order-reference-service-sbom
          path: sbom.json
          if-no-files-found: error
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: wave1-runtime-evidence
          path: wave1-evidence/
          if-no-files-found: error

  wave3-postgresql:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: orders
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d orders"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Run PostgreSQL migration and integration suite
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-local-only@127.0.0.1:5432/orders
        run: npm run test:postgresql
      - name: Run Wave3 API recovery and backup restore drills
        env:
          WAVE3_EVIDENCE_OUTPUT: .evidence-results/wave3-api-recovery.json
        run: |
          mkdir -p .evidence-results
          timeout --signal=TERM --kill-after=10s 5m node scripts/postgresql/wave3-api-recovery.js
          timeout --signal=TERM --kill-after=10s 3m env WAVE3_EVIDENCE_OUTPUT=.evidence-results/postgresql-restore.json scripts/postgresql/wave3-restore-drill.sh
      - name: Run Wave3 operational PostgreSQL drill
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-local-only@127.0.0.1:5432/orders
          WAVE3_EVIDENCE_OUTPUT: .evidence-results/wave3-operational.json
        run: timeout --signal=TERM --kill-after=10s 5m node scripts/postgresql/wave3-operational-drill.js
      - name: Upload Wave3 secret-free evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: wave3-postgresql-evidence
          path: .evidence-results/
          if-no-files-found: error
          include-hidden-files: true
